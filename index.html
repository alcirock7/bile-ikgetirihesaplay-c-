<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Yatırım ve Sermaye Simülatörü v2.0</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-4 md:p-8">
    <div class="max-w-6xl mx-auto space-y-12">
        
        <!-- SİSTEM 1: DÜZENLİ BİRİKİM -->
        <section class="bg-gray-800 p-6 rounded-2xl border border-gray-700 shadow-2xl">
            <h2 class="text-2xl font-bold mb-6 text-blue-400 border-b border-gray-700 pb-2">Sistem 1: Düzenli Birikim (Kar Topu)</h2>
            <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
                <div class="space-y-4">
                    <div>
                        <label class="text-xs text-gray-400 uppercase font-bold">Başlangıç Sermayesi (TL)</label>
                        <input type="number" id="s1_initial" value="0" class="w-full bg-gray-700 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="text-xs text-gray-400 uppercase font-bold">Her Seferde Yatan (TL)</label>
                        <input type="number" id="s1_deposit" value="100" class="w-full bg-gray-700 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="text-xs text-gray-400 uppercase font-bold">Sıklık</label>
                        <select id="s1_freq" class="w-full bg-gray-700 p-3 rounded-lg outline-none">
                            <option value="365">Günlük</option>
                            <option value="52">Haftalık</option>
                            <option value="12" selected>Aylık</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs text-gray-400 uppercase font-bold">Yıllık Beklenen Getiri (%)</label>
                        <input type="number" id="s1_rate" value="40" class="w-full bg-gray-700 p-3 rounded-lg outline-none">
                    </div>
                    <div>
                        <label class="text-xs text-gray-400 uppercase font-bold">Süre (Yıl) - İşte Senin X Değerin</label>
                        <input type="number" id="s1_years" value="1" class="w-full bg-gray-700 p-3 rounded-lg outline-none">
                    </div>
                    <div class="p-4 bg-blue-900/20 rounded-xl">
                        <p class="text-sm text-blue-300">Final Bakiyesi:</p>
                        <p id="s1_total" class="text-2xl font-black text-blue-400">0 TL</p>
                    </div>
                </div>
                <div class="lg:col-span-3 h-[450px]">
                    <canvas id="chart1"></canvas>
                </div>
            </div>
        </section>

        <!-- SİSTEM 2: SERMAYE KATLAMA (ALTTA DURMAYA DEVAM EDİYOR) -->
        <!-- ... (Buradaki kod aynı kalabilir veya istersen silebilirsin) ... -->

    </div>

    <script>
        let chart1;

        function updateS1() {
            const initial = parseFloat(document.getElementById('s1_initial').value) || 0;
            const deposit = parseFloat(document.getElementById('s1_deposit').value) || 0;
            const freq = parseInt(document.getElementById('s1_freq').value);
            const rate = (parseFloat(document.getElementById('s1_rate').value) || 0) / 100;
            const years = parseFloat(document.getElementById('s1_years').value) || 1;
            
            const periodRate = Math.pow(1 + rate, 1/freq) - 1;
            
            let current = initial;
            let labels = [];
            let data = [];
            let totalPeriods = Math.floor(freq * years);

            for (let i = 0; i <= totalPeriods; i++) {
                if (i > 0) {
                    current = (current + deposit) * (1 + periodRate);
                }
                
                // Grafik çok kalabalık olmasın diye sadece belirli noktaları çiziyoruz
                let shouldShow = false;
                if (freq === 365 && i % 10 === 0) shouldShow = true; // Günlükse 10 günde 1
                if (freq === 52 && i % 2 === 0) shouldShow = true;   // Haftalıksa 2 haftada 1
                if (freq === 12) shouldShow = true;                 // Aylıksa her ay
                if (i === totalPeriods) shouldShow = true;          // Son gün her zaman

                if (shouldShow) {
                    labels.push(i + ". Periyot");
                    data.push(current.toFixed(0));
                }
            }
            document.getElementById('s1_total').innerText = new Intl.NumberFormat('tr-TR').format(current.toFixed(0)) + " TL";
            renderChart('chart1', labels, data, '#3b82f6', chart1, (c) => chart1 = c);
        }

        function renderChart(canvasId, labels, data, color, chartInstance, setChartInstance) {
            if (chartInstance) chartInstance.destroy();
            const ctx = document.getElementById(canvasId).getContext('2d');
            const newChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Bakiye (TL)',
                        data: data,
                        borderColor: color,
                        backgroundColor: color + '33',
                        fill: true,
                        tension: 0.3,
                        pointRadius: 2
                    }]
                },
                options: {
                    maintainAspectRatio: false,
                    scales: {
                        y: { grid: { color: '#374151' } },
                        x: { ticks: { color: '#9ca3af' } }
                    },
                    plugins: { legend: { display: false } }
                }
            });
            setChartInstance(newChart);
        }

        document.querySelectorAll('input, select').forEach(el => el.addEventListener('input', updateS1));
        updateS1();
    </script>
</body>
</html>
